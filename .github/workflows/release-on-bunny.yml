name: Deploy Bunny Scripting Script

on:
  push:
    branches:
      - main
  workflow_dispatch:

# id-token: write is required. Without a deploy_key the Bunny action
# authenticates with a GitHub OIDC token, which needs this permission.
permissions:
  id-token: write
  contents: read

jobs:
  update-script:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build script.ts from site files
        run: python3 scripts/build-script.py

      - name: Publish the script to Bunny
        uses: BunnyWay/actions/deploy-script@main
        with:
          script_id: 92887
          file: "script.ts"
